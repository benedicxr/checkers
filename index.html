<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/main.js" type="module" defer></script>
    <title>Checkers</title>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <h1 class="title">Checkers</h1>
                <div id="turn-indicator" class="turn" aria-live="polite"></div>
            </div>
            <div class="actions">
                <button id="undo-btn" class="btn" type="button">Undo</button>
                <button id="new-game-btn" class="btn" type="button">New game</button>
            </div>
        </header>
        <div id="board-game" class="board" aria-label="Checkers board"></div>
    </div>
</body>
</html>
